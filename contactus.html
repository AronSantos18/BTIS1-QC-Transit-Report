<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="contactus.css">
  </head>




  <body>
    <header class="sticky">
      <div class="logo-container">
         <a class="arrow" href="previouspage">&lt;</a>
        <img class="logo" src="url" alt="logo">
      </div>




      <nav>
        <strong>
          <a href="index.html"> home </a>
          <a href="viewreports"> view report </a>
          <a href="aboutus"> about us </a>
          <a href="contactus.html"> contact us </a>
        </strong>
      </nav>
    </header>



    <h3 id="directory"> <u>Home</u> > Contact Us </h3>
    <h1 id="contactus"> Contact Us </h1>


    <div class="main-container">
      <form class="contact-form">
        <div class="form-row">
          <div class="form-group">
            <label class="labeltext" for="name">Name</label>
            <input type="text" id="name" name="name">
          </div>


          <div class="form-group">
            <label class="labeltext" for="contact">Email or mobile number</label>
            <input type="text" id="contact" name="contact">
          </div>
        </div>




        <div class="form-group">
          <label class="labeltext" for="subject">Subject</label>
          <select id="subject" name="subject">
            <option value="" disabled selected>Select a subject</option>
            <option value="general">General Inquiry</option>
            <option value="support">Support</option>
          </select>
        </div>




        <div class="form-group">
            <label class="labeltext" for="message"> Message </label>
            <textarea id="message" name="message"></textarea>
        </div>


        <div class="form-group" id="submit-button">
            <button type="button"> Submit Message </button>
        </div>
      </form>


      <div class="side-boxes">
        <div id="emergency-number">
          <h3> Emergency? Call 0920-964-3687 </h3>
        </div>


        <div>
          <h1 id="other-ways"> 
            Other Ways To Reach Us 
            <br>
            <br><br>
            Email: [EMAIL ADDRESS]
            <br><br>
            Office Address: [OFFICE ADDRESS]
            <br><br>
            Office Hours: [OFFICE HOURS]
          </h1>
        </div>

        <img src="https://www.shutterstock.com/shutterstock/videos/1108737813/thumb/12.jpg?ip=x480" id="office-map">
      </div>
    </div>

    <footer> </footer>
  </body>


</html>
